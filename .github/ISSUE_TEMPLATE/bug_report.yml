name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: APOLO version / commit
  - type: input
    id: env
    attributes:
      label: Windows and Node versions
      placeholder: Windows 11 24H2, Node 22.x
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs. Remove any tokens or API keys first.
      render: text
