; Ojo de escritorio de APOLO (FASE 7.1): ESP32-S3 + GC9A01 240x240 + INMP441 + MAX98357A (+ OV2640 opcional)
; Compilar:  pio run                 (todas las placas)
;            pio run -e xiao_s3_sense -t upload    · monitor: pio device monitor
; Pines: src/config.h · Guía: docs/ojo/README.md

[platformio]
default_envs = xiao_s3_sense, devkit_s3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.1
    tzapu/WiFiManager@^2.0.17
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DOJO_VERSION=\"0.1.0\"

; Seeed Studio XIAO ESP32S3 Sense (cámara OV2640 incluida, 8 MB PSRAM)
[env:xiao_s3_sense]
board = seeed_xiao_esp32s3
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DPLACA_XIAO_S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3-DevKitC-1 (N16R8 o N8R2), sin cámara por defecto
[env:devkit_s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DPLACA_DEVKIT_S3
